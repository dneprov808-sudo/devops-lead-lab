name: Academy Release CI

on:
  pull_request:
    branches: [academy/stable]
  push:
    branches: [academy/stable]
  workflow_dispatch:

# Public contributors must never run with write credentials or repository secrets.
permissions:
  contents: read

concurrency:
  group: academy-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: academy-release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Python dependencies and Chromium
        run: |
          python -m pip install -r requirements-v11-dev.txt
          python -m playwright install --with-deps chromium
      - name: Native release gate
        run: python release/gate.py --full --report "$RUNNER_TEMP/academy-gate.json"
      - name: Build standalone website
        run: python site/build.py
      - name: Guided course browser acceptance
        run: python release/site_browser_e2e.py
