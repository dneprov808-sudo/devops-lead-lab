# Use with compose.yaml and dedicated project academy-v11-ha; PGHOST=pg1,pg2.
x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.21
  profiles: [ha]
  mem_limit: 192m
x-pg: &pg
  build: ../practice/patroni
  profiles: [ha]
  depends_on: [etcd1,etcd2,etcd3]
  mem_limit: 512m
services:
  etcd1:
    <<: *etcd
    command: ["/usr/local/bin/etcd","--name=etcd1","--data-dir=/etcd-data","--listen-client-urls=http://0.0.0.0:2379","--advertise-client-urls=http://etcd1:2379","--listen-peer-urls=http://0.0.0.0:2380","--initial-advertise-peer-urls=http://etcd1:2380","--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380","--initial-cluster-token=academy-v11-ha"]
    volumes: ["etcd1-data:/etcd-data"]
  etcd2:
    <<: *etcd
    command: ["/usr/local/bin/etcd","--name=etcd2","--data-dir=/etcd-data","--listen-client-urls=http://0.0.0.0:2379","--advertise-client-urls=http://etcd2:2379","--listen-peer-urls=http://0.0.0.0:2380","--initial-advertise-peer-urls=http://etcd2:2380","--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380","--initial-cluster-token=academy-v11-ha"]
    volumes: ["etcd2-data:/etcd-data"]
  etcd3:
    <<: *etcd
    command: ["/usr/local/bin/etcd","--name=etcd3","--data-dir=/etcd-data","--listen-client-urls=http://0.0.0.0:2379","--advertise-client-urls=http://etcd3:2379","--listen-peer-urls=http://0.0.0.0:2380","--initial-advertise-peer-urls=http://etcd3:2380","--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380","--initial-cluster-token=academy-v11-ha"]
    volumes: ["etcd3-data:/etcd-data"]
  pg1:
    <<: *pg
    environment:
      PATRONI_NAME: pg1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_SCOPE: academy-v11-ha
    volumes: ["pg1-data:/var/lib/postgresql/data"]
  pg2:
    <<: *pg
    environment:
      PATRONI_NAME: pg2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_SCOPE: academy-v11-ha
    volumes: ["pg2-data:/var/lib/postgresql/data"]
volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  pg1-data:
  pg2-data:
