name: academy-practice
services:
  postgres:
    image: postgres:16
    profiles: [postgres]
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: academy-local-only
      POSTGRES_DB: academy
    volumes: [postgres-data:/var/lib/postgresql/data]
  kafka:
    image: apache/kafka:4.1.2
    profiles: [kafka]
  redis:
    image: redis:7
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis-data:/data]
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    profiles: [patroni]
    command: ["/usr/local/bin/etcd", "--name=etcd", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd:2380", "--initial-cluster=etcd=http://etcd:2380"]
    volumes: [etcd-data:/etcd-data]
  pg1:
    build: {context: ./patroni}
    profiles: [patroni]
    depends_on: [etcd]
    environment:
      PATRONI_NAME: pg1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
    volumes: [pg1-data:/var/lib/postgresql/data]
  pg2:
    build: {context: ./patroni}
    profiles: [patroni]
    depends_on: [etcd]
    environment:
      PATRONI_NAME: pg2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
    volumes: [pg2-data:/var/lib/postgresql/data]
  backend:
    image: nginx:1.28-alpine
    profiles: [nginx]
  nginx:
    image: nginx:1.28-alpine
    profiles: [nginx]
    depends_on: [backend]
    ports: ["127.0.0.1:18081:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
volumes:
  postgres-data:
  redis-data:
  etcd-data:
  pg1-data:
  pg2-data:
