apiVersion: v1
kind: Namespace
metadata:
  name: academy-v9
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: academy-v9
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: api
        image: nginx:1.28-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: academy-v9
spec:
  selector: {app: backend}
  ports:
  - port: 80
    targetPort: 80
