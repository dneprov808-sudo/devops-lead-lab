name: academy-production
services:
  api:
    build: .
    command: ["api"]
    volumes: ["orders:/data"]
    ports: ["127.0.0.1:18088:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 128m
  worker:
    build: .
    command: ["worker"]
    volumes: ["orders:/data"]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:19088:9090"]
    mem_limit: 256m
volumes:
  orders:
