apiVersion: apps/v1
kind: Deployment
metadata:
  name: academy-v11-api
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: academy-v11-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: academy-v11-api}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: api
        image: {{ .Values.image | quote }}
        ports: [{containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 2
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: academy-v11-api
spec:
  selector: {app: academy-v11-api}
  ports: [{port: 80, targetPort: 80}]
